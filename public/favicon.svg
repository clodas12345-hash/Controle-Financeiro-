<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Central Shield / Finance Symbol -->
  <g transform="translate(96, 96)" filter="url(#shadow)">
    <!-- Outer Shield Outline -->
    <path d="M 160 20 L 290 65 C 290 200 215 265 160 300 C 105 265 30 200 30 65 Z" fill="#064e3b" fill-opacity="0.6" stroke="url(#glowGrad)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Stylized GKD / Car / Finance Elements -->
    <!-- Upward Trend Chart Arrow -->
    <path d="M 80 200 L 135 145 L 180 185 L 245 105" fill="none" stroke="#34d399" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 215 105 L 245 105 L 245 135" fill="none" stroke="#34d399" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Mobility Wheel / Dot Accent -->
    <circle cx="160" cy="90" r="18" fill="url(#accentGrad)" />
    
    <!-- Dollar / Financial Bar Accents -->
    <rect x="95" y="210" width="18" height="35" rx="6" fill="#10b981" fill-opacity="0.7" />
    <rect x="135" y="195" width="18" height="50" rx="6" fill="#10b981" fill-opacity="0.85" />
    <rect x="175" y="180" width="18" height="65" rx="6" fill="#34d399" />
    <rect x="215" y="150" width="18" height="95" rx="6" fill="#6ee7b7" />
  </g>
</svg>
