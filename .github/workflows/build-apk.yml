name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Criar GitHub Release com APK para download direto no celular'
        required: false
        type: boolean
        default: true

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          set +e
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | sdkmanager --licenses 2>/dev/null || true
          exit 0

      - name: Install Android SDK Platforms & Build Tools
        run: |
          set +e
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
          exit 0

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build:web

      - name: Initialize / Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply Custom GKD Logo & App Assets
        run: |
          node generate-android-assets.cjs
          node scripts/apply-android-icons.mjs

      - name: Decodificar ou Gerar Keystore de Assinatura
        run: |
          mkdir -p ~/.android
          SECRET_BASE64="${{ secrets.DEBUG_KEYSTORE_BASE64 }}"
          if [ -n "$SECRET_BASE64" ]; then
            echo "$SECRET_BASE64" | tr -d '[:space:]' | base64 -d > release.keystore 2>/dev/null || true
            if [ -s "release.keystore" ]; then
              cp release.keystore ~/.android/debug.keystore
              echo "✅ Keystore decodificado a partir do segredo DEBUG_KEYSTORE_BASE64"
            else
              echo "⚠️ Segredo inválido ou vazio, gerando keystore padrão..."
              rm -f release.keystore
            fi
          fi
          
          if [ ! -f "~/.android/debug.keystore" ] && [ ! -f "release.keystore" ]; then
            echo "ℹ️ Gerando keystore padrão de debug automaticamente..."
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          elif [ -f "release.keystore" ]; then
            cp release.keystore ~/.android/debug.keystore
          fi
          ls -la ~/.android/debug.keystore || true

      - name: Forçar signingConfig do App para Usar o Keystore Fixo
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if grep -q "android.signingConfigs.debug.storeFile" "$BUILD_GRADLE"; then
              echo "ℹ️ signingConfig já estava configurado"
            else
              cat >> "$BUILD_GRADLE" << 'EOF'

android.signingConfigs.debug.storeFile = new File(System.getProperty("user.home") + "/.android/debug.keystore")
android.signingConfigs.debug.storePassword = "android"
android.signingConfigs.debug.keyAlias = "androiddebugkey"
android.signingConfigs.debug.keyPassword = "android"
android.buildTypes.debug.signingConfig = android.signingConfigs.debug
EOF
              echo "✅ signingConfig do buildType debug configurado com sucesso"
            fi
          else
            echo "⚠️ android/app/build.gradle não encontrado"
          fi

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar Fingerprint da Assinatura do APK
        continue-on-error: true
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "APK não encontrado"
            exit 0
          fi
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "=== Fingerprint da assinatura deste APK ==="
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner não encontrado - pulando verificação"
            exit 0
          fi
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256\|SHA-1" || true

      - name: Prepare APK for Distribution
        run: |
          mkdir -p release-artifacts
          APK_SRC=$(ls android/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [ -n "$APK_SRC" ]; then
            cp "$APK_SRC" release-artifacts/Controle-Financeiro.apk
            echo "✅ APK pronto em release-artifacts/Controle-Financeiro.apk"
            ls -lh release-artifacts/Controle-Financeiro.apk
          else
            echo "❌ Nenhum APK encontrado para copiar"
            exit 1
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Controle-Financeiro-APK
          path: release-artifacts/Controle-Financeiro.apk
          retention-days: 30

      - name: Create GitHub Release (Download Direto no Celular)
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ format('Controle Financeiro v1.0.{0}', github.run_number) }}
          body: |
            ## 📱 Controle Financeiro - Versão Android Pronta para Instalar

            ### 🚀 Como instalar / atualizar no celular:
            1. Baixe o arquivo **`Controle-Financeiro.apk`** abaixo diretamente pelo navegador do celular.
            2. Toque no arquivo baixado para abrir.
            3. Como a assinatura é consistente, as novas versões atualizam o aplicativo sem perda de dados!
            4. Se o Android perguntar, confirme a permissão para atualizar/instalar.

            ---
            *Build gerado automaticamente pelo GitHub Actions (Execução #${{ github.run_number }}).*
          files: release-artifacts/Controle-Financeiro.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
